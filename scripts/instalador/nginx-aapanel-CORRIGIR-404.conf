# =============================================================================
# aaPanel / Nginx — CORRIGE 404 Not Found
# Site: sgh.pajotech.com.br
#
# CAUSA DO 404: Nginx procura ficheiros estáticos (/login, /api...) que não
# existem no disco. O SGH é Node.js — TODAS as URLs devem ir para a porta 3002.
# =============================================================================

# --- Opção A: aaPanel (recomendado) ---
# 1. Website → sgh.pajotech.com.br → Reverse proxy → Create
#    Nome: node_sgh
#    Target URL: http://127.0.0.1:3002
#    Ativar proxy para TODO o site (/)
#
# 2. App Store → PM2 Manager (ou Node) → Add project
#    Path: /www/wwwroot/sgh.pajotech.com.br
#    Startup: index.js
#    Port: 3002
#    → Start
#
# 3. Terminal (se PM2 não estiver no painel):
#    cd /www/wwwroot/sgh.pajotech.com.br && ./instalar.sh

# --- Opção B: Colar no ficheiro de configuração do site (dentro de server { }) ---
# aaPanel → Website → sgh.pajotech.com.br → Config → editar nginx

location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_read_timeout 86400;
    proxy_send_timeout 60s;
}

# REMOVA ou comente blocos conflituosos como:
#   location ~ \.php$ { ... }
#   try_files $uri $uri/ =404;   ← isto causa 404 no Next.js!
#
# NÃO sirva /_next/static manualmente a partir de ficheiros antigos —
# deixe TUDO passar pelo proxy para o Node (porta 3002).

client_max_body_size 25m;

# --- Teste rápido no servidor ---
# curl -I http://127.0.0.1:3002/login     → deve retornar 200 ou 307
# curl -I https://sgh.pajotech.com.br/login → depois de configurar proxy
